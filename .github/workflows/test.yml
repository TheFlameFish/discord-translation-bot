name: Run Pytest

on:
  pull_request:
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        docker build -t theflamefish/discord-translation-bot .

    - name: Run tests inside Docker container
      run: |
        docker run --rm -v $(pwd)/discord-translation-bot:/app/data theflamefish/discord-translation-bot pytest
